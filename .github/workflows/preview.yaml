name: Preview

on:
  push:
    branches:
      - "task/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDFs
        run: |
          mkdir -p build
          # Run each tailored .tex file through the full TeX Live Docker image.
          # The container mounts the repo at /work; pdflatex writes PDFs to /work/build.
          for f in src/coverletter-*.tex src/resume-*.tex; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            echo "▶ Building $fname..."
            docker run --rm \
              -v "$PWD:/work" \
              -w /work/src \
              ghcr.io/xu-cheng/texlive-full:latest \
              sh -c "pdflatex --shell-escape -interaction=nonstopmode -output-directory /work/build '$fname'" \
              && echo "✅ $fname" || echo "❌ $fname"
          done
          echo "PDFs produced:"
          ls build/*.pdf 2>/dev/null || echo "(none)"

      - name: Derive names
        id: names
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          # Artifact names cannot contain slashes — replace with dashes
          SAFE_BRANCH="${BRANCH//\//-}"
          TAG="preview/${BRANCH#task/}"
          echo "safe_branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "pdfs-${{ steps.names.outputs.safe_branch }}"
          path: build/*.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Delete existing prerelease (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.names.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create prerelease with PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.names.outputs.tag }}"
          BRANCH="${GITHUB_REF_NAME}"
          TITLE="Preview: ${BRANCH#task/}"
          NOTES="Automated preview build for branch \`${BRANCH}\`.

          **PDFs attached below** — download the assets to view your tailored resume and cover letter.

          Built from commit \`${{ github.sha }}\` on $(date -u '+%Y-%m-%d %H:%M UTC')."

          mapfile -t PDFS < <(ls build/*.pdf 2>/dev/null)
          if [ ${#PDFS[@]} -eq 0 ]; then
            echo "No PDFs found — skipping release creation."
            exit 1
          fi

          gh release create "$TAG" "${PDFS[@]}" \
            --prerelease \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$BRANCH"
