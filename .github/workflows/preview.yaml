name: Preview

on:
  push:
    branches:
      - "task/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Build PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            coverletter-*.tex
            resume-*.tex
          work_in_root_file_dir: true
          glob_root_file: true
          args: -shell-escape -interaction=nonstopmode
          extra_system_packages: py3-pygments

      - name: Collect PDFs
        run: |
          # xu-cheng/latex-action outputs PDFs alongside the source files
          find src -name "coverletter-*.pdf" -o -name "resume-*.pdf" | while read f; do
            mv "$f" build/
          done
          echo "PDFs in build/:"
          ls build/*.pdf 2>/dev/null || echo "(none)"

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "pdfs-${{ github.ref_name }}"
          path: build/*.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Derive prerelease tag
        id: tag
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TAG="preview/${BRANCH#task/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Preview tag: $TAG"

      - name: Delete existing prerelease (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create prerelease with PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BRANCH="${GITHUB_REF_NAME}"
          TITLE="Preview: ${BRANCH#task/}"
          NOTES="Automated preview build for branch \`${BRANCH}\`.

          **PDFs attached below** — download the assets to view your tailored resume and cover letter.

          Built from commit \`${{ github.sha }}\` on $(date -u '+%Y-%m-%d %H:%M UTC')."

          mapfile -t PDFS < <(ls build/*.pdf 2>/dev/null)
          if [ ${#PDFS[@]} -eq 0 ]; then
            echo "No PDFs found — skipping release creation."
            exit 1
          fi

          gh release create "$TAG" "${PDFS[@]}" \
            --prerelease \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$BRANCH"
