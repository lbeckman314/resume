name: Preview

on:
  push:
    branches:
      - "task/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-english \
            texlive-science \
            lmodern \
            latexmk \
            python3-pygments

      - name: Build PDFs
        working-directory: src
        run: |
          mkdir -p ../build
          FAILED=0
          # Build any coverletter-*.tex and resume-*.tex files present on this branch
          for f in coverletter-*.tex resume-*.tex; do
            [ -f "$f" ] || continue
            echo "Building $f..."
            TEXINPUTS=.//:: pdflatex --shell-escape -interaction=nonstopmode \
              -output-directory ../build "$f" \
              && echo "✅ $f" || { echo "❌ $f (check logs)"; FAILED=1; }
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more PDFs failed to build — check logs above."
            exit 1
          fi
          PDF_COUNT=$(ls ../build/*.pdf 2>/dev/null | wc -l)
          echo "Built $PDF_COUNT PDF(s) successfully."

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ github.ref_name }}
          path: build/*.pdf
          if-no-files-found: warn
          retention-days: 90

      - name: Derive prerelease tag
        id: tag
        run: |
          # Convert branch name like task/intel-applied-ml-engineer
          # to tag preview/intel-applied-ml-engineer
          BRANCH="${GITHUB_REF_NAME}"
          TAG="preview/${BRANCH#task/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Preview tag: $TAG"

      - name: Delete existing prerelease (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Delete the release (ignore errors if it doesn't exist)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: Create prerelease with PDFs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BRANCH="${GITHUB_REF_NAME}"
          TITLE="Preview: ${BRANCH#task/}"
          NOTES="Automated preview build for branch \`${BRANCH}\`.

          **PDFs attached below** — download the assets to view your tailored resume and cover letter.

          Built from commit \`${{ github.sha }}\` on $(date -u '+%Y-%m-%d %H:%M UTC')."

          # Collect PDFs into an array to avoid glob expansion issues
          mapfile -t PDFS < <(ls build/*.pdf 2>/dev/null)
          if [ ${#PDFS[@]} -eq 0 ]; then
            echo "No PDFs found — skipping release creation."
            exit 1
          fi

          gh release create "$TAG" "${PDFS[@]}" \
            --prerelease \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$BRANCH"
