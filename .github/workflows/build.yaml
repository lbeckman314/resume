name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          os: alpine
          scheme: small
          run: |
            # Ensure tlmgr matches the package repository before installing
            tlmgr update --self

            # LaTeX packages
            tlmgr install    \
              datetime2      \
              easylist       \
              enumitem       \
              environ        \
              etoolbox       \
              eso-pic        \
              fvextra        \
              fontawesome5   \
              framed         \
              ifoddpage      \
              minted         \
              pdfcol         \
              pgf            \
              tcolorbox      \
              tikzfill       \
              tikzpagenodes  \
              titlesec       \
              titling        \
              tools          \
              upquote        \
              xstring

            # Pygments for minted
            apk add py3-pip
            pip3 install --break-system-packages pygments

            apk add make
            make

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: build/*.pdf
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
