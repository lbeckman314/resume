name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: latest
          os: alpine
          scheme: small
          run: |
            # LaTeX packages
            PACKAGES="       \
              datetime2      \
              charter        \
              easylist       \
              enumitem       \
              environ        \
              etoolbox       \
              eso-pic        \
              fvextra        \
              microtype      \
              fontawesome5   \
              framed         \
              ifoddpage      \
              minted         \
              pdfcol         \
              pgf            \
              tcolorbox      \
              tikzfill       \
              tikzpagenodes  \
              titlesec       \
              titling        \
              tools          \
              upquote        \
              xstring"

            # Mirrors can be caught mid-sync (checksum mismatches), so try a
            # few stable ones in turn instead of a random mirror.ctan.org pick
            MIRRORS="
              https://ctan.math.illinois.edu/systems/texlive/tlnet
              https://mirrors.mit.edu/CTAN/systems/texlive/tlnet
              https://mirror.las.iastate.edu/tex-archive/systems/texlive/tlnet
            "
            installed=false
            for mirror in $MIRRORS; do
              echo "Using TeX Live mirror: $mirror"
              tlmgr option repository "$mirror"
              # Ensure tlmgr matches the package repository before installing
              if tlmgr update --self && tlmgr install $PACKAGES; then
                installed=true
                break
              fi
              echo "Mirror $mirror failed; trying next"
            done
            if [ "$installed" != true ]; then
              echo "All TeX Live mirrors failed" >&2
              exit 1
            fi

            # Pygments for minted
            apk add py3-pip
            pip3 install --break-system-packages pygments

            apk add make
            make

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: build/*.pdf
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
